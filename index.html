<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Alan-11 Songbook</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#24262b}*{box-sizing:border-box}body{margin:0;background:#f5f5f5}button,input,select,textarea{font:inherit}button{cursor:pointer}header{background:#bd303a;color:white;display:flex;align-items:center;justify-content:space-between;padding:14px 18px;gap:10px}header strong{font-size:20px}.btn{border:0;border-radius:8px;padding:9px 13px;background:#eee;color:#333}.primary{background:#c6313d;color:white}.tools{display:flex;gap:8px;flex-wrap:wrap}.search{width:100%;border:1px solid #ddd;padding:14px;border-radius:10px;font-size:17px}.wrap{max-width:1150px;margin:auto;padding:15px}.bar{background:#bd303a;color:white;text-align:center;padding:8px;font-weight:700;letter-spacing:2px;margin:15px 0 0}.entry{background:white;border-bottom:1px solid #e5e5e5;padding:13px;display:flex;align-items:center;gap:10px;cursor:pointer}.entry:hover{background:#f9eff0}.entry .name{flex:1}.muted{font-size:12px;color:#777}.foot{position:sticky;bottom:0;background:#fff;border-top:1px solid #ddd;padding:10px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.hidden{display:none!important}.song{background:#101114;color:#eee;min-height:100vh}.song header{background:#202126}.song .paper{max-width:1150px;margin:auto;padding:15px 16px 180px}.song h1{margin:8px 0 2px}.song .chord{color:#8fd7e9;font-weight:700;white-space:pre-wrap}.song .lyrics{white-space:pre-wrap;line-height:1.8;font-size:19px;overflow-wrap:anywhere}.song .line{margin:0 0 12px}.song .line .lyrictext{color:#f2f2f2}.song .aligned{position:relative;white-space:pre;min-width:max-content}.song .aligned .lyrictext{white-space:pre;line-height:1.8}.song .aligned .chordlayer{position:relative;height:1.45em;white-space:nowrap}.song .aligned .chordlayer span{position:absolute;top:0;color:#8fd7e9;font-weight:700;white-space:nowrap}.song #lyricArea{overflow-x:auto}.song .line{width:max-content;min-width:100%}.song .line .lyrictext::first-letter{color:#e46d6d}.song .tab{background:#ede8da;color:#444;border-radius:6px;padding:12px;white-space:pre-wrap;font-family:monospace;overflow:auto;font-size:12px}.song .chorddock{position:fixed;bottom:0;left:0;right:0;background:#242529;border-top:2px solid #8d9299;padding:9px 14px;display:flex;gap:12px;overflow:auto;max-height:160px}.shape{min-width:83px;text-align:center;font-size:12px;color:#d9e4ed}.fret{border:1px solid #999;background:repeating-linear-gradient(to bottom,transparent 0,transparent 17px,#888 18px),repeating-linear-gradient(to right,transparent 0,transparent 12px,#888 13px);height:74px;margin:4px auto;width:67px;opacity:.8}.trans{display:flex;align-items:center;gap:9px;flex-wrap:wrap;background:#25272c;padding:12px;border-radius:10px;margin:14px 0}.trans b{font-size:23px;color:#8fd7e9}.trans button{background:#39424d;color:#fff;border:0;border-radius:8px;padding:10px 15px}.modal{position:fixed;inset:0;background:#0009;display:grid;place-items:center;z-index:10;padding:12px}.panel{background:#fff;color:#222;border-radius:12px;padding:20px;max-width:650px;width:100%;max-height:94vh;overflow:auto}.panel label{display:block;margin:12px 0 5px;font-weight:600}.panel input,.panel textarea,.panel select{width:100%;padding:10px;border:1px solid #bbb;border-radius:7px}.panel textarea{height:180px;font-family:monospace}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}.hint{color:#777;font-size:12px;line-height:1.6}.empty{padding:22px;text-align:center;color:#777;background:white}@media(min-width:800px){.song .lyrics{font-size:21px}}

/* v2: chord-over-lyrics, section labels and measure bars */
.song #lyricArea{overflow-x:auto;overflow-y:visible;padding-bottom:20px}
.song .line.aligned{position:relative;display:block;width:max-content;min-width:100%;white-space:pre;margin:0 0 13px}
.song .aligned .chordlayer{position:relative;height:1.45em;white-space:nowrap;line-height:1.4}
.song .aligned .chordlayer .chordmark{position:absolute;top:0;color:#9de8f5;font-weight:700;white-space:pre}
.song .aligned .lyrictext{display:block;white-space:pre;line-height:1.6;overflow:visible}
.song .sectionlabel{display:inline-block;color:#f18b8b;font-weight:700;margin-right:0.5em}
.song .measure{color:#9de8f5;font-weight:700}
.song .aligned.sectioned .sectionlabel{position:absolute;left:0;top:0}
.song .aligned.sectioned .lyrictext{margin-left:5.5em}
.song .sectiononly{color:#f18b8b;font-weight:700;margin:14px 0 7px}
.song .syntaxhelp{color:#777;font-size:12px;line-height:1.6}
</style></head><body>
<section id="home"><header><button class="btn" onclick="openSettings()">Settings</button><strong>Alan-11 Songbook</strong><button class="btn" onclick="showEditor()">+ Add</button></header><main class="wrap"><input id="search" class="search" placeholder="🔍 搜索歌名、歌手或标签..." oninput="renderHome()"><div class="bar">· · · Sets · · ·</div><div id="sets"></div><div class="bar">· · · Songs · · ·</div><div id="songs"></div></main><nav class="foot"><div class="tools"><button class="btn" onclick="sortBy='title';renderHome()">Title 排序</button><button class="btn" onclick="sortBy='artist';renderHome()">Artist 排序</button><button class="btn" onclick="sortBy='language';renderHome()">Tags 分类</button></div><div class="tools"><button class="btn" onclick="exportData()">↥ Export</button><button class="btn primary" onclick="showEditor()">＋ Add</button></div></nav></section>
<section id="songview" class="song hidden"><header><button class="btn" onclick="backHome()">‹ 返回</button><strong id="songTitle">歌曲</strong><div class="tools"><button class="btn" onclick="editCurrent()">编辑</button><button class="btn" onclick="toggleFavorite()" id="favBtn">☆</button></div></header><div class="paper"><h1 id="songHeading"></h1><div class="muted" id="songMeta"></div><div class="trans"><span>当前 Key</span><b id="keyNow">C</b><button onclick="changeKey(-1)">− 半音</button><button onclick="changeKey(1)">+ 半音</button><button onclick="resetKey()">恢复</button><button onclick="changeFont(-2)">A−</button><button onclick="changeFont(2)">A+</button></div><div id="tabArea" class="tab"></div><div id="lyricArea" class="lyrics"></div></div><div id="chordDock" class="chorddock"></div></section>
<div id="modal" class="modal hidden"><div class="panel"><h2 id="modalTitle">新增歌曲</h2><label>歌名</label><input id="fTitle" placeholder="例如：海阔天空"><label>歌手</label><input id="fArtist" placeholder="例如：Beyond"><div class="row"><div><label>语言 / 标签</label><select id="fLang"><option>华语</option><option>粤语</option><option>英文</option><option>福建语</option><option>马来语</option><option>其他</option></select></div><div><label>歌曲基准 Key</label><select id="fKey"></select></div></div><label>所属 Set（可留空）</label><input id="fSet" placeholder="例如：今晚驻唱"><label>歌词与和弦</label><textarea id="fBody" placeholder="[C]这是第一句[Am]歌词&#10;[F]这是第二句[G]歌词"></textarea><div class="hint">在歌词换和弦的位置前写 [C]、[Am]、[F#m7]、[G/B] 等。系统会自动转调并把和弦显示在歌词上方。暂不支持精确逐字定位的复杂 TAB 编辑。</div><label>TAB 六线谱（可留空）</label><textarea id="fTab" style="height:85px" placeholder="e|----------------|&#10;B|----------------|"></textarea><div class="row" style="margin-top:16px"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="saveSong()">保存歌曲</button></div><button id="deleteBtn" class="btn hidden" style="margin-top:12px;color:#c22" onclick="deleteSong()">删除这首歌</button></div></div>
<script>
const chroma=['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];const keyOpts=['C','C#','Db','D','D#','Eb','E','F','F#','Gb','G','G#','Ab','A','A#','Bb','B'];const KEY='alan11_v1_songs';const seed=[{id:'sample1',title:'海阔天空',artist:'Beyond',language:'粤语',key:'E',set:'My First Set',favorite:true,body:'[E]这里放入你自己的歌词和和弦\n[B]点击编辑即可替换示范内容\n[C#m]升降 Key 会同步转换和弦 [A]试试看',tab:'e|----------------|\nB|----------------|\nG|----------------|\nD|----------------|\nA|----------------|\nE|----------------|'},{id:'sample2',title:'安静',artist:'周杰伦',language:'华语',key:'C',set:'',favorite:false,body:'[C]示范歌词，请自行编辑\n[Am]你的歌谱会显示在这里',tab:''}];let songs;try{songs=JSON.parse(localStorage.getItem(KEY));if(!Array.isArray(songs))throw 0}catch{songs=seed}let sortBy='title',current=null,offset=0,font=19,editing=null;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function persist(){try{localStorage.setItem(KEY,JSON.stringify(songs))}catch(e){alert('储存失败，请立即导出备份：'+e.message)}}function renderHome(){const q=$('search').value.trim().toLowerCase();const found=songs.filter(s=>[s.title,s.artist,s.language,s.set].some(x=>String(x||'').toLowerCase().includes(q))).sort((a,b)=>String(a[sortBy]||'').localeCompare(String(b[sortBy]||''),'zh'));const sets=[...new Set(songs.map(s=>s.set).filter(Boolean))];$('sets').innerHTML=sets.length?sets.map(x=>`<div class="entry" onclick="filterSet('${encodeURIComponent(x)}')"><span class="name">${esc(x)}</span><span class="muted">${songs.filter(s=>s.set===x).length} Songs　›</span></div>`).join(''):'<div class="empty">暂无 Setlist，在新增歌曲时可以填写所属 Set</div>';$('songs').innerHTML=found.length?found.map(s=>`<div class="entry" onclick="openSong('${encodeURIComponent(s.id)}')"><span class="name">${s.favorite?'★ ':''}${esc(s.title)} <span class="muted">[${esc(s.artist)}]</span></span><span class="muted">${esc(s.language)} · ${esc(s.key)}　›</span></div>`).join(''):'<div class="empty">没有找到歌曲</div>'}function filterSet(v){$('search').value=decodeURIComponent(v);renderHome()}function parseNote(note){const m=note.match(/^([A-G])([#b]?)(.*)$/);if(!m)return null;const natural={C:0,D:2,E:4,F:5,G:7,A:9,B:11};return {idx:(natural[m[1]]+(m[2]==='#'?1:m[2]==='b'?-1:0)+12)%12,tail:m[3]}}function shiftChord(ch){if(!ch||ch==='N.C.')return ch;return ch.split('/').map(part=>{const n=parseNote(part);return n?chroma[(n.idx+offset%12+12)%12]+n.tail:part}).join('/')}function currentKey(){return shiftChord(current.key)}function openSong(id){current=songs.find(s=>s.id===decodeURIComponent(id));if(!current)return;offset=0;$('home').classList.add('hidden');$('songview').classList.remove('hidden');renderSong();window.scrollTo(0,0)}function parseScoreLine(raw){
  // [前奏]/[间奏]/[尾奏] is a section label, not a chord.
  // The pipe | is a literal measure marker and remains visible in the lyric row.
  let chords=[],text='',section='',last=0;const rx=/\[([^\]]+)\]/g;let m;
  while((m=rx.exec(raw))){
    text+=raw.slice(last,m.index);const tag=m[1].trim();
    if(/^(前奏|间奏|尾奏|主歌|副歌|桥段|Intro|Verse|Chorus|Bridge|Outro)(?:\s*\d+)?$/i.test(tag)){
      if(!section && !text.trim())section=tag;
      else text+='【'+tag+'】';
    }else if(/^[A-G](?:#|b)?(?:[^\s\]]*)$|^N\.C\.$/.test(tag)){
      chords.push({pos:text.length,name:shiftChord(tag)});
    }else{text+='['+m[1]+']'}
    last=rx.lastIndex;
  }
  text+=raw.slice(last);
  return {text,chords,section};
}
function renderSong(){
  if(!current)return;
  $('songTitle').textContent=current.title;$('songHeading').textContent=current.title;
  $('songMeta').textContent=[current.artist,current.language].filter(Boolean).join(' · ');
  $('keyNow').textContent=currentKey();$('favBtn').textContent=current.favorite?'★':'☆';
  $('tabArea').textContent=current.tab||'TAB 六线谱区域 · 可在编辑歌曲时加入';
  const body=current.body||'点击右上角「编辑」添加歌词与和弦';
  $('lyricArea').style.fontSize=font+'px';
  $('lyricArea').innerHTML=body.split('\n').map((raw,i)=>{
    const p=parseScoreLine(raw);const label=p.section?`<span class="sectionlabel">【${esc(p.section)}】</span>`:'';
    if(p.section && !p.text.trim() && !p.chords.length)return `<div class="sectiononly">${label}</div>`;
    // Section label occupies the left of the chord row, not the lyric row.
    return `<div class="line aligned ${p.section?'sectioned':''}" data-line="${i}"><div class="chordlayer">${label}${p.chords.map(c=>`<span class="chordmark" data-pos="${c.pos}">${esc(c.name)}</span>`).join('')}</div><div class="lyrictext">${esc(p.text)||'　'}</div></div>`;
  }).join('');
  alignChords();
  const chords=[...new Set((body.match(/\[([^\]]+)\]/g)||[]).map(x=>x.slice(1,-1)).filter(x=>/^[A-G](?:#|b)?[^\s]*$/.test(x)).map(shiftChord))];
  $('chordDock').innerHTML=chords.length?chords.map(c=>`<div class="shape"><b>${esc(c)}</b><div class="fret" aria-label="指法图占位"></div></div>`).join(''):'<div class="muted">和弦指法区域</div>';
}
function alignChords(){
  // DOM Range measures real rendered character positions (Chinese/English/spaces),
  // rather than guessing character widths from a monospace approximation.
  const area=$('lyricArea');
  area.querySelectorAll('.aligned').forEach(line=>{
    const lyric=line.querySelector('.lyrictext'),node=lyric.firstChild;
    if(!node || node.nodeType!==Node.TEXT_NODE)return;
    const start=line.querySelector('.chordlayer').getBoundingClientRect().left;const lyricLeft=lyric.getBoundingClientRect().left;
    const range=document.createRange();
    line.querySelectorAll('.chordmark').forEach(ch=>{
      const pos=Math.max(0,Math.min(node.length,Number(ch.dataset.pos)));
      range.setStart(node,0);range.setEnd(node,pos);
      // The width of the selected prefix equals the x-coordinate of the chord.
      const rect=range.getBoundingClientRect();
      ch.style.left=(pos===0?lyricLeft-start:rect.right-start)+'px';
    });
  });
}
window.addEventListener('resize',()=>{if(current)alignChords()});
function changeKey(n){offset+=n;renderSong()}function resetKey(){offset=0;renderSong()}function changeFont(n){font=Math.max(14,Math.min(32,font+n));renderSong()}function backHome(){$('songview').classList.add('hidden');$('home').classList.remove('hidden');renderHome()}function toggleFavorite(){current.favorite=!current.favorite;persist();renderSong()}function showEditor(s=null){editing=s?s.id:null;$('modalTitle').textContent=s?'编辑歌曲':'新增歌曲';$('fTitle').value=s?.title||'';$('fArtist').value=s?.artist||'';$('fLang').value=s?.language||'华语';$('fKey').value=s?.key||'C';$('fSet').value=s?.set||'';$('fBody').value=s?.body||'';$('fTab').value=s?.tab||'';$('deleteBtn').classList.toggle('hidden',!s);$('modal').classList.remove('hidden')}function editCurrent(){showEditor(current)}function closeModal(){$('modal').classList.add('hidden')}function saveSong(){const title=$('fTitle').value.trim();if(!title){alert('请填写歌名');return}const obj={id:editing||'s'+Date.now(),title,artist:$('fArtist').value.trim(),language:$('fLang').value,key:$('fKey').value,set:$('fSet').value.trim(),body:$('fBody').value,tab:$('fTab').value,favorite:editing?(songs.find(s=>s.id===editing)?.favorite||false):false};if(editing){songs=songs.map(s=>s.id===editing?obj:s)}else songs.push(obj);persist();closeModal();if(current&&current.id===obj.id){current=obj;offset=0;renderSong()}else renderHome()}function deleteSong(){if(!editing||!confirm('确定删除这首歌？请先备份。'))return;songs=songs.filter(s=>s.id!==editing);persist();closeModal();backHome()}function exportData(){const blob=new Blob([JSON.stringify({app:'Alan-11 Songbook',version:1,songs},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='alan11-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}function openSettings(){const action=prompt('设置：输入 1 导出备份；输入 2 导入备份（会覆盖现有歌曲）');if(action==='1')exportData();if(action==='2')$('importFile').click()}function importData(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.songs)||!d.songs.every(s=>typeof s.title==='string'&&typeof s.id==='string'))throw 0;if(!confirm('导入会覆盖当前全部歌曲。确定已经备份了吗？'))return;songs=d.songs;persist();renderHome();alert('导入完成')}catch{alert('备份文件格式不正确')}};r.readAsText(file)}$('fKey').innerHTML=keyOpts.map(k=>`<option>${k}</option>`).join('');renderHome();
</script><input type="file" id="importFile" accept=".json,application/json" style="display:none" onchange="importData(this.files[0]);this.value=''" /></body></html>
