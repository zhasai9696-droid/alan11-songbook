<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Alan-11 Songbook</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#242424;background:#f2f2f2}*{box-sizing:border-box}body{margin:0}header{background:#ad393e;color:white;padding:16px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:5}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:10px 14px}header button{background:#fff;color:#333}h1{font-size:23px;margin:0}main{max-width:1100px;margin:auto;padding:16px}.search{width:100%;padding:15px;border:1px solid #ddd;border-radius:12px;font-size:18px;margin-bottom:14px}h2{background:#ad393e;color:white;text-align:center;letter-spacing:3px;padding:12px;margin:18px 0 0;font-size:20px}.item{background:white;border-bottom:1px solid #ddd;padding:15px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;cursor:pointer}.muted{color:#777;font-size:14px}.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-top:15px}.toolbar button,.primary{background:#ad393e;color:#fff}.secondary{background:#e6e6e6}.hidden{display:none!important}.panel{background:#fff;padding:16px;border-radius:12px;margin:14px 0}.field{display:block;width:100%;padding:12px;margin:7px 0 14px;border:1px solid #ccc;border-radius:8px}.editor{min-height:240px;font-family:ui-monospace,Menlo,monospace;font-size:18px;line-height:1.7;white-space:pre;tab-size:4}.hint{font-size:13px;color:#666}.song-title{font-size:26px;margin:10px 0 0}.song-area{background:#fff;padding:20px 14px;min-height:60vh;overflow-x:auto}.song-line{position:relative;white-space:pre;font-family:ui-monospace,Menlo,monospace;font-size:20px;line-height:1.3;padding-top:28px;min-height:54px;width:max-content;min-width:100%;cursor:text}.chord{position:absolute;top:0;color:#ad393e;font-weight:700;white-space:nowrap}.lyric{white-space:pre}.section{color:#ad393e;font-weight:700;margin:22px 0 5px}.modal-bg{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;z-index:20;padding:14px}.modal{background:#fff;width:min(470px,100%);max-height:90vh;overflow:auto;border-radius:16px;padding:16px;box-shadow:0 15px 50px #0004}.modal-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.modal-head h3{margin:0}.chord-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:14px}.chord-grid button{background:#eee;font-weight:600}.chord-grid button.selected{background:#ad393e;color:white}.preview{background:#f5f5f5;padding:14px;border-radius:10px;margin:12px 0;font-size:23px;text-align:center}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}.danger{background:#8b2020;color:white}.small{font-size:14px}footer{padding:12px;text-align:center;color:#888}.note{background:#fff4d8;border-radius:10px;padding:12px;font-size:14px}
</style></head><body><header><button onclick="goHome()">⌂ Home</button><h1>Alan-11 Songbook</h1><button onclick="newSong()">＋ Add</button></header><main><section id="home"><input class="search" id="search" placeholder="🔍 搜索歌名、歌手或标签..." oninput="renderHome()"><h2>· · · Sets · · ·</h2><div id="sets"></div><h2>· · · Songs · · ·</h2><div id="songs"></div><div class="toolbar"><button onclick="setSort('title')">Title 排序</button><button onclick="setSort('artist')">Artist 排序</button><button onclick="setSort('tag')">Tags 分类</button><button onclick="exportData()">⇧ Export 备份</button><button onclick="document.getElementById('import').click()">⇩ Import 恢复</button><input id="import" type="file" accept="application/json" hidden onchange="importData(event)"></div></section><section id="view" class="hidden"><div class="toolbar"><button onclick="goHome()">← 返回</button><button onclick="editCurrent()">✎ 编辑 / 插入 Chord</button><button onclick="transpose(-1)">♭ -1</button><button onclick="transpose(1)">♯ +1</button><button onclick="changeSize(-2)">A−</button><button onclick="changeSize(2)">A＋</button></div><div class="song-area"><h3 id="viewTitle" class="song-title"></h3><div class="muted" id="viewMeta"></div><div id="sheet"></div></div></section><section id="edit" class="hidden"><div class="toolbar"><button onclick="goHome()">← 返回</button><button class="primary" onclick="saveSong()">✓ 保存歌曲</button><button class="danger" id="deleteBtn" onclick="deleteSong()">删除</button></div><div class="panel"><label>歌名<input class="field" id="title" placeholder="歌名"></label><label>歌手<input class="field" id="artist" placeholder="歌手"></label><div class="row"><label>调性<input class="field" id="key" placeholder="C"></label><label>标签<input class="field" id="tag" placeholder="华语、粤语..."></label></div><label>歌单<input class="field" id="set" placeholder="My First Set"></label><p class="hint">点击歌词编辑框中的指定位置，然后点「插入 Chord」。也可以直接输入 [Am]、[G7] 等，和弦会显示在后面的歌词上方。段落标题写成 [主歌]、[副歌]。</p><div class="toolbar"><button class="primary" onclick="openPicker()">🎸 插入 Chord</button><button onclick="insertText('[主歌]\n')">＋ 主歌</button><button onclick="insertText('[副歌]\n')">＋ 副歌</button><button onclick="insertText('|')">＋ 小节线</button></div><textarea id="lyrics" class="field editor" spellcheck="false" placeholder="[主歌]\n[C]第一句歌词 [Am]第二句歌词"></textarea><div class="note">提示：选中一个已有的 [Am] 等和弦，再打开 Chord Picker，可以直接替换。未选中文字时，会在光标位置插入。</div></div></section></main><footer>Alan-11 Songbook · 本机浏览器储存 · 请定期 Export 备份</footer><div class="modal-bg hidden" id="picker"><div class="modal"><div class="modal-head"><button onclick="closePicker()">Close</button><h3>Chord Picker</h3><button class="primary" onclick="insertChord()">Insert</button></div><div class="preview" id="chordPreview">C</div><div class="small">根音 Root</div><div class="chord-grid" id="roots"></div><p class="small">和弦类型 Chord type</p><div class="chord-grid" id="types"></div><div class="toolbar"><button onclick="setRoot('C')">C</button><button onclick="setRoot('G')">G</button><button onclick="setRoot('D')">D</button><button onclick="setRoot('A')">A</button><button onclick="setRoot('F')">F</button></div></div></div><script>
const STORE='alan11-songbook-v3';let songs=[],current=null,editing=null,sort='title',shift=0,fontSize=20,pickRoot='C',pickType='',selectionStart=0,selectionEnd=0;
const demo=[{id:'demo1',title:'安静',artist:'周杰伦',key:'C',tag:'华语',set:'My First Set',lyrics:'[主歌]\n[C]这里只是和弦排版示例\n[Am]点编辑可以输入自己的歌词\n[副歌]\n[F]点击指定歌词位置 [G]插入和弦'},{id:'demo2',title:'海阔天空',artist:'Beyond',key:'E',tag:'粤语',set:'',lyrics:'[主歌]\n[E]在这里输入自己的歌词\n[A]使用 Chord Picker 插入和弦'}];
try{let v=JSON.parse(localStorage.getItem(STORE));songs=Array.isArray(v)?v:demo}catch(e){songs=demo}function persist(){try{localStorage.setItem(STORE,JSON.stringify(songs))}catch(e){alert('储存失败，请导出备份。')}}function show(id){['home','view','edit'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id))}function goHome(){show('home');renderHome()}function setSort(s){sort=s;renderHome()}function renderHome(){let q=document.getElementById('search').value.trim().toLowerCase(),filtered=songs.filter(s=>[s.title,s.artist,s.tag,s.set].some(v=>(v||'').toLowerCase().includes(q)));filtered.sort((a,b)=>(a[sort]||'').localeCompare(b[sort]||'','zh'));let sets=[...new Set(songs.map(s=>s.set).filter(Boolean))];document.getElementById('sets').innerHTML=sets.length?sets.map(name=>`<div class="item" data-set="${esc(name)}"><span>${esc(name)}</span><span class="muted">${songs.filter(s=>s.set===name).length} Songs ›</span></div>`).join(''):'<div class="item muted">尚无歌单</div>';document.querySelectorAll('[data-set]').forEach(el=>el.onclick=()=>{document.getElementById('search').value=el.dataset.set;renderHome()});document.getElementById('songs').innerHTML=filtered.length?filtered.map(s=>`<div class="item" data-id="${esc(s.id)}"><span>${esc(s.title)} <span class="muted">[${esc(s.artist||'')}]</span></span><span class="muted">${esc(s.tag||'')} · ${esc(s.key||'C')} ›</span></div>`).join(''):'<div class="item muted">没有匹配歌曲</div>';document.querySelectorAll('[data-id]').forEach(el=>el.onclick=()=>viewSong(el.dataset.id))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function newSong(){editing=null;['title','artist','tag','set'].forEach(id=>document.getElementById(id).value='');document.getElementById('key').value='C';document.getElementById('lyrics').value='[主歌]\n';document.getElementById('deleteBtn').classList.add('hidden');show('edit')}function editCurrent(){let s=songs.find(s=>s.id===current);if(!s)return;editing=s.id;['title','artist','key','tag','set','lyrics'].forEach(k=>document.getElementById(k).value=s[k]||'');document.getElementById('deleteBtn').classList.remove('hidden');show('edit')}function saveSong(){let title=document.getElementById('title').value.trim();if(!title)return alert('请填写歌名');let obj={id:editing||'song-'+Date.now(),title,...Object.fromEntries(['artist','key','tag','set','lyrics'].map(k=>[k,document.getElementById(k).value]))};if(editing){songs=songs.map(s=>s.id===editing?obj:s)}else songs.push(obj);persist();current=obj.id;shift=0;viewSong(obj.id)}function deleteSong(){if(!editing||!confirm('确定删除这首歌？'))return;songs=songs.filter(s=>s.id!==editing);persist();goHome()}
const chroma=['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];const sharps=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];function shiftChord(ch,n){return ch.replace(/^([A-G])([#b]?)/,(_,r,acc)=>{let i=chroma.indexOf(r+acc);if(i<0)i=sharps.indexOf(r+acc);return i<0?r+acc:chroma[(i+n+120)%12]})}function viewSong(id){current=id;shift=0;renderSong();show('view')}function transpose(n){shift+=n;renderSong()}function changeSize(n){fontSize=Math.max(12,Math.min(36,fontSize+n));renderSong()}
function renderSong(){let s=songs.find(x=>x.id===current);if(!s)return;document.getElementById('viewTitle').textContent=s.title;document.getElementById('viewMeta').textContent=[s.artist,s.tag,s.key?'原调 '+s.key:'',shift?'移调 '+(shift>0?'+':'')+shift:''].filter(Boolean).join(' · ');let lines=(s.lyrics||'').split('\n');let html='';for(let line of lines){if(/^\[(主歌|副歌|前奏|间奏|尾奏|桥段|Intro|Verse|Chorus|Bridge|Outro|间奏\d*|主歌\d*|副歌\d*)\]$/i.test(line.trim())){html+=`<div class="section">${esc(line.trim().slice(1,-1))}</div>`;continue}let lyric='',marks=[],re=/\[([A-G](?:#|b)?(?:maj7|maj9|m7b5|m7|sus2|sus4|add9|dim7|dim|aug|m|7|9|11|13|6|2|4)?(?:\/[A-G][#b]?)?)\]/g,last=0,m;while((m=re.exec(line))){lyric+=line.slice(last,m.index);marks.push({at:[...lyric].length,ch:m[1]});last=re.lastIndex}lyric+=line.slice(last);let chars=[...lyric],measure=20;html+=`<div class="song-line" style="font-size:${fontSize}px"><span class="lyric">${esc(lyric||' ')}</span>`;for(let mark of marks){let parts=mark.ch.split('/'),ch=shiftChord(parts[0],shift)+(parts[1]?'/'+shiftChord(parts[1],shift):'');html+=`<span class="chord" style="left:${mark.at}ch">${esc(ch)}</span>`}html+='</div>'}document.getElementById('sheet').innerHTML=html}
function insertText(v){let el=document.getElementById('lyrics'),a=el.selectionStart,b=el.selectionEnd;el.value=el.value.slice(0,a)+v+el.value.slice(b);el.focus();el.setSelectionRange(a+v.length,a+v.length)}const roots=['C','C#','Db','D','D#','Eb','E','F','F#','Gb','G','G#','Ab','A','A#','Bb','B'];const types=[['','maj'],['m','m'],['7','7'],['maj7','maj7'],['m7','m7'],['sus2','sus2'],['sus4','sus4'],['dim','dim'],['aug','aug'],['add9','add9'],['6','6'],['9','9'],['m7b5','m7♭5']];function openPicker(){let el=document.getElementById('lyrics');selectionStart=el.selectionStart;selectionEnd=el.selectionEnd;let selected=el.value.slice(selectionStart,selectionEnd).match(/^\[([A-G][#b]?)(.*)\]$/);if(selected){pickRoot=selected[1];pickType=selected[2]}else{pickRoot='C';pickType=''}renderPicker();document.getElementById('picker').classList.remove('hidden')}function closePicker(){document.getElementById('picker').classList.add('hidden')}function setRoot(v){pickRoot=v;renderPicker()}function setType(v){pickType=v;renderPicker()}function renderPicker(){document.getElementById('chordPreview').textContent=pickRoot+pickType;document.getElementById('roots').innerHTML=roots.map(v=>`<button class="${v===pickRoot?'selected':''}" data-root="${v}">${v}</button>`).join('');document.getElementById('types').innerHTML=types.map(([v,label])=>`<button class="${v===pickType?'selected':''}" data-type="${v}">${label}</button>`).join('');document.querySelectorAll('[data-root]').forEach(el=>el.onclick=()=>setRoot(el.dataset.root));document.querySelectorAll('[data-type]').forEach(el=>el.onclick=()=>setType(el.dataset.type))}function insertChord(){let el=document.getElementById('lyrics'),v='['+pickRoot+pickType+']';el.value=el.value.slice(0,selectionStart)+v+el.value.slice(selectionEnd);closePicker();el.focus();el.setSelectionRange(selectionStart+v.length,selectionStart+v.length)}function exportData(){let blob=new Blob([JSON.stringify(songs,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='alan11-songbook-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function importData(ev){let f=ev.target.files[0];if(!f)return;let reader=new FileReader();reader.onload=()=>{try{let data=JSON.parse(reader.result);if(!Array.isArray(data)||!data.every(s=>s&&typeof s.title==='string'&&typeof s.lyrics==='string'))throw Error();if(confirm('导入会覆盖当前歌曲，请先导出备份。确定继续？')){songs=data;persist();renderHome()}}catch(e){alert('备份文件格式不正确')}};reader.readAsText(f);ev.target.value=''}renderHome();
</script></body></html>
